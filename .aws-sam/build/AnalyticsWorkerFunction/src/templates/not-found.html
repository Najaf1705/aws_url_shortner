<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Link unavailable</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #0f172a;
            color: #f8fafc;
            font-family: Inter, system-ui, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 600px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow:
                0 20px 40px rgba(0, 0, 0, .35),
                inset 0 1px 0 rgba(255, 255, 255, .05);
        }

        .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            transition: .2s ease;
        }

        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .footer {
            margin-top: 24px;
            color: #64748b;
            font-size: 0.875rem;
        }

        code {
            background: #0f172a;
            padding: 2px 8px;
            border-radius: 6px;
            color: #cbd5e1;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">🔗</div>

        <h1>Link unavailable</h1>

        <p>
            This short link doesn't exist, has expired,
            or was removed by its creator.
        </p>

        <a href="https://shorty.najaf.in" class="btn" rel="noopener noreferrer">
            Back to Shorty
        </a>

        <div class="footer">
            Error <code>404</code>
        </div>
    </div>
</body>

</html>
