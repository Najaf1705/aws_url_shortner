AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Production-shaped URL shortener (Phase 1)

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        ALLOWED_ORIGINS: http://localhost:5173, https://shorty.najaf.in
        LOG_LEVEL: info
        CODE_LENGTH: 7
        JWT_SECRET: replace-with-something-long

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowCredentials: true
        AllowOrigins:
          - http://localhost:5173
          - https://shorty.najaf.in
        AllowMethods:
          - "*"
        AllowHeaders:
          - Content-Type
          - Authorization
          - Shorty-Guest-Id



  UrlTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: url-shortener-urls
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
        - AttributeName: userId
          AttributeType: S

      KeySchema:
        - AttributeName: code
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL



  ClickEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: url-shortener-click-events
      VisibilityTimeout: 90
      MessageRetentionPeriod: 345600 # 4 days

  CreateLinkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../services/api
      Handler: createLink.handler
      Events:
        CreateLinkRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /link
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UrlTable
      Environment:
        Variables:
          URL_TABLE_NAME: !Ref UrlTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/createLink.ts
        Bundle: true
        Minify: true
        Target: es2022



  GetLinksFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../services/api
      Handler: getLinks.handler
      Events:
        GetLinksRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /links
            Method: GET
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UrlTable
      Environment:
        Variables:
          URL_TABLE_NAME: !Ref UrlTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/getLinks.ts
        Bundle: true
        Minify: true
        Target: es2022

  ClaimGuestLinksFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../services/api
      Handler: claimGuestLinks.handler
      Events:
        ClaimGuestLinksRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /links/claim
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UrlTable
      Environment:
        Variables:
          URL_TABLE_NAME: !Ref UrlTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/claimGuestLinks.ts
        Bundle: true
        Minify: true
        Target: es2022


  RedirectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../services/api
      Handler: redirect.handler
      Events:
        RedirectRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{code}
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UrlTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ClickEventsQueue.QueueName
      Environment:
        Variables:
          URL_TABLE_NAME: !Ref UrlTable
          CLICK_QUEUE_URL: !Ref ClickEventsQueue
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/redirect.ts
        Bundle: true
        Minify: true
        Target: es2022


  AnalyticsWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../services/api
      Handler: analyticsWorker.handler
      Timeout: 15
      MemorySize: 256
      Events:
        ClickQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ClickEventsQueue.Arn
            BatchSize: 10
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref UrlTable
      Environment:
        Variables:
          URL_TABLE_NAME: !Ref UrlTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/analyticsWorker.ts
        Bundle: true
        Minify: true
        Target: es2022


Outputs:
  ApiBaseUrl:
    Description: Base URL for HTTP API
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod
